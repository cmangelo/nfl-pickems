<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Leaderboard in progress</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1014}
*{box-sizing:border-box}
a{color:#FF9A5C}a:hover{color:#FFB585}
.cond{font-family:'Barlow Condensed',sans-serif}
.ico{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;align-items:center;gap:8px;height:60px;padding:0 12px 0 6px;border-bottom:1px solid #232733;flex-shrink:0}
.wkbtn{display:flex;align-items:center;gap:2px;height:44px;padding:0 8px;border-radius:10px;color:#F2F3F5;text-decoration:none;font:700 28px 'Barlow Condensed',sans-serif}
.wkbtn:hover{color:#F2F3F5;background:#1F232C}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:5px 10px;border-radius:999px}
.pill.live{background:#3A1717;color:#FF9C9C}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.avatar{margin-left:auto;width:40px;height:40px;border-radius:50%;border:0;background:#262A33;color:#F2F3F5;font:700 16px 'Barlow',sans-serif}
.nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#12141A;border-top:1px solid #232733;height:64px;flex-shrink:0}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:#9AA1AD;text-decoration:none}
.nav a.on{color:#FF7A2F}
.nav svg{width:22px;height:22px}
.row{width:100%;display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 12px;border:0;border-bottom:1px solid #232733;background:#171A21;font:inherit;color:inherit;text-align:left;cursor:pointer}
.row.me{background:#2A1D14}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:52px;height:28px;padding:0 6px;border-radius:6px;font:700 15px 'Barlow Condensed',sans-serif}
.chip.ok{background:#12301F;color:#8FF0BC}
.chip.no{background:#3A1717;color:#FF9C9C;text-decoration:line-through}
.chip.pend{background:transparent;color:#C9CDD4;border:1.5px dashed #4A505C}
</style>
</helmet>
<div style="width: 390px; height: 1120px; display: flex; flex-direction: column; background: #0E1014; font-family: 'Barlow', sans-serif; color: #F2F3F5">
<header class="top">
<a class="wkbtn" href="Weeks.dc.html" aria-label="Week 5, change week">Week 5<svg viewBox="0 0 24 24" width="20" height="20" class="ico" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></a>
<span class="pill live"><span class="dot"></span>Live</span>
<button class="avatar" aria-label="Account menu">D</button>
</header>
<main style="flex-grow: 1; overflow-y: auto; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 12px">
<div style="flex-grow: 1; font-size: 14px; line-height: 1.35"><strong>9 of 14 games final</strong><br><span style="color: #9AA1AD">Updated 3 min ago</span></div>
<button aria-label="Refresh scores" style="width: 44px; height: 44px; border-radius: 10px; border: 1.5px solid #2F3440; background: #171A21; color: #F2F3F5; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="20" height="20" class="ico"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"></path></svg></button>
</div>
<div style="background: #171A21; border: 1px solid #232733; border-radius: 14px; overflow: hidden">
<div style="display: flex; gap: 10px; padding: 8px 12px; font-size: 12px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: #9AA1AD; border-bottom: 1px solid #232733">
<span style="width: 38px">Rank</span><span style="flex-grow: 1">Player</span><span style="width: 44px; text-align: right">TB</span><span style="width: 48px; text-align: right">Right</span>
</div>
<sc-for list="{{players}}" as="p" hint-placeholder-count="9">
<div>
<button class="{{p.rowCls}}" aria-expanded="{{p.open}}" onClick="{{p.toggle}}">
<span class="cond" style="width: 38px; font-size: 19px; font-weight: 700; color: #9AA1AD">{{p.rank}}</span>
<span style="flex-grow: 1; font-size: 17px; font-weight: 600">{{p.name}}<sc-if value="{{p.me}}" hint-placeholder-val="{{ false }}"> <span style="font-size: 12px; font-weight: 700; color: #FF9A5C">YOU</span></sc-if></span>
<span style="width: 44px; text-align: right; font-size: 15px; color: #9AA1AD">{{p.tb}}</span>
<span class="cond" style="width: 48px; text-align: right; font-size: 24px; font-weight: 700">{{p.c}}</span>
</button>
<sc-if value="{{p.open}}" hint-placeholder-val="{{ false }}">
<div style="padding: 10px 12px 14px; background: #12141A; border-bottom: 1px solid #232733; display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{p.chips}}" as="c" hint-placeholder-count="14"><span class="{{c.cls}}">{{c.t}}</span></sc-for>
</div>
</sc-if>
</div>
</sc-for>
</div>
<div style="font-size: 13px; line-height: 1.4; color: #9AA1AD">Tap a player to see their picks. TB = Monday-night total guess; it breaks ties once NYJ @ NE is final.</div>
<div style="border: 1px dashed #4A505C; border-radius: 12px; padding: 10px 12px">
<div style="font-size: 12px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: #9AA1AD; margin-bottom: 4px">Not counted · unpaid</div>
<div style="display: flex; align-items: center; justify-content: space-between; font-size: 16px; color: #9AA1AD"><span>Nick</span><span class="cond" style="font-size: 22px; font-weight: 700">6</span></div>
</div>
</main>
<nav class="nav" aria-label="Main">
<a href="MyPicksLive.dc.html"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="M8 12l3 3 5-6"></path></svg>My Picks</a>
<a class="on" href="Live.dc.html" aria-current="page"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M6 20V11M12 20V4M18 20v-6"></path></svg>Leaderboard</a>
<a href="Games.dc.html"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"></rect><path d="M4 12h16M12 5v14"></path></svg>Games</a>
<a href="AdminPay.dc.html"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"></path></svg>Admin</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1120}}'>
const G = [
  { a: 'TB', h: 'ATL', w: 'h' }, { a: 'MIN', h: 'CLE', w: 'a' }, { a: 'NYG', h: 'NO', w: 'a' },
  { a: 'DAL', h: 'PIT', w: 'h' }, { a: 'MIA', h: 'CAR', w: 'h' }, { a: 'HOU', h: 'BAL', w: 'h' },
  { a: 'CIN', h: 'IND', w: 'a' }, { a: 'LV', h: 'LAC', w: 'h' }, { a: 'ARI', h: 'SF', w: 'h' },
  { a: 'GB', h: 'LAR' }, { a: 'BUF', h: 'JAX' }, { a: 'SEA', h: 'WAS' }, { a: 'KC', h: 'DET' }, { a: 'NYJ', h: 'NE' }
];
const FINAL = 9;
const P = [
  { n: 'Mike', c: 8, tb: 44, s: 1 }, { n: 'Sarah', c: 8, tb: 38, s: 2 },
  { n: 'Dan', c: 7, tb: 47, s: 3, me: true }, { n: 'Tony', c: 7, tb: 51, s: 4 },
  { n: 'Jess', c: 7, tb: 41, s: 5 }, { n: 'Ryan', c: 6, tb: 40, s: 6 },
  { n: 'Kevin', c: 6, tb: 35, s: 7 }, { n: 'Alex', c: 5, tb: 49, s: 8 },
  { n: 'Matt', c: 4, tb: 43, s: 0 }
];
function side(p, i) {
  if (i < FINAL) {
    const wrong = ((i * 5 + p.s) % FINAL) < (FINAL - p.c);
    return wrong ? (G[i].w === 'a' ? 'h' : 'a') : G[i].w;
  }
  return (i + p.s) % 2 ? 'h' : 'a';
}
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: 'Mike' }; }
  renderVals() {
    const { open } = this.state;
    return {
      players: P.map((p) => {
        const ahead = P.filter((q) => q.c > p.c).length;
        const tied = P.filter((q) => q.c === p.c).length > 1;
        return {
          name: p.n, c: p.c, tb: p.tb, me: !!p.me,
          rank: (tied ? 'T-' : '') + (ahead + 1),
          open: open === p.n,
          rowCls: p.me ? 'row me' : 'row',
          toggle: () => this.setState({ open: open === p.n ? null : p.n }),
          chips: G.map((g, i) => {
            const sd = side(p, i);
            const t = sd === 'a' ? g.a : g.h;
            if (i >= FINAL) return { t, cls: 'chip pend' };
            return sd === g.w ? { t: t + ' ✓', cls: 'chip ok' } : { t: t + ' ✗', cls: 'chip no' };
          })
        };
      })
    };
  }
}
</script>
</body>
</html>
