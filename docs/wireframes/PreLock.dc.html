<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Leaderboard before lock</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1014}
*{box-sizing:border-box}
a{color:#FF9A5C}a:hover{color:#FFB585}
.cond{font-family:'Barlow Condensed',sans-serif}
.ico{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;align-items:center;gap:8px;height:60px;padding:0 12px 0 6px;border-bottom:1px solid #232733;flex-shrink:0}
.wkbtn{display:flex;align-items:center;gap:2px;height:44px;padding:0 8px;border-radius:10px;color:#F2F3F5;text-decoration:none;font:700 28px 'Barlow Condensed',sans-serif}
.wkbtn:hover{color:#F2F3F5;background:#1F232C}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:5px 10px;border-radius:999px}
.pill.open{background:#3A2416;color:#FFB585}
.avatar{margin-left:auto;width:40px;height:40px;border-radius:50%;border:0;background:#262A33;color:#F2F3F5;font:700 16px 'Barlow',sans-serif}
.nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#12141A;border-top:1px solid #232733;height:64px;flex-shrink:0}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:#9AA1AD;text-decoration:none}
.nav a.on{color:#FF7A2F}
.nav svg{width:22px;height:22px}
.li{display:flex;align-items:center;gap:10px;min-height:50px;padding:6px 14px;border-bottom:1px solid #232733;font-size:16px}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #0E1014; font-family: 'Barlow', sans-serif; color: #F2F3F5">
<header class="top">
<a class="wkbtn" href="Weeks.dc.html" aria-label="Week 5, change week">Week 5<svg viewBox="0 0 24 24" width="20" height="20" class="ico" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></a>
<span class="pill open">Open</span>
<button class="avatar" aria-label="Account menu">D</button>
</header>
<main style="flex-grow: 1; overflow-y: auto; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 14px">
<section style="background: #171A21; border: 1px solid #232733; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px">
<div style="width: 52px; height: 52px; border-radius: 50%; background: #262A33; color: #FFB585; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="26" height="26" class="ico" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
</div>
<div class="cond" style="font-size: 24px; font-weight: 700">Picks revealed Thu 12:00 PM PT</div>
<div style="font-size: 15px; color: #9AA1AD; line-height: 1.4">The leaderboard and everyone's picks unlock when the week locks. For now, here's who's in.</div>
</section>
<div>
<div style="display: flex; justify-content: space-between; font-size: 15px; margin-bottom: 6px"><strong>7 of 10 in</strong><span style="color: #9AA1AD">3 still to submit</span></div>
<div style="height: 8px; background: #262A33; border-radius: 4px; overflow: hidden"><div style="height: 100%; width: 70%; background: #FF7A2F; border-radius: 4px"></div></div>
</div>
<section style="background: #171A21; border: 1px solid #232733; border-radius: 14px; overflow: hidden">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
<div class="li">
<span style="{{r.nameStyle}}">{{r.n}}</span>
<span style="{{r.stStyle}}">{{r.st}}</span>
</div>
</sc-for>
</section>
</main>
<nav class="nav" aria-label="Main">
<a href="Picks.dc.html"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="M8 12l3 3 5-6"></path></svg>My Picks</a>
<a class="on" href="PreLock.dc.html" aria-current="page"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M6 20V11M12 20V4M18 20v-6"></path></svg>Leaderboard</a>
<a href="PreLock.dc.html"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"></rect><path d="M4 12h16M12 5v14"></path></svg>Games</a>
<a href="AdminPay.dc.html"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"></path></svg>Admin</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const IN = ['Mike', 'Sarah', 'Dan (you)', 'Tony', 'Jess', 'Ryan', 'Kevin'];
const OUT = ['Alex', 'Matt', 'Nick'];
class Component extends DCLogic {
  renderVals() {
    const base = 'margin-left: auto; font-size: 14px; font-weight: 600; ';
    return {
      rows: IN.map((n) => ({ n, st: '✓ In', nameStyle: 'font-weight: 600', stStyle: base + 'color: #8FF0BC' }))
        .concat(OUT.map((n) => ({ n, st: 'Not yet', nameStyle: 'font-weight: 500; color: #9AA1AD', stStyle: base + 'color: #9AA1AD' })))
    };
  }
}
</script>
</body>
</html>
