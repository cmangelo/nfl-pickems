<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin games</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1014}
*{box-sizing:border-box}
a{color:#FF9A5C}a:hover{color:#FFB585}
.cond{font-family:'Barlow Condensed',sans-serif}
.ico{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;align-items:center;gap:8px;height:60px;padding:0 12px 0 6px;border-bottom:1px solid #232733;flex-shrink:0}
.wkbtn{display:flex;align-items:center;gap:2px;height:44px;padding:0 8px;border-radius:10px;color:#F2F3F5;text-decoration:none;font:700 28px 'Barlow Condensed',sans-serif}
.wkbtn:hover{color:#F2F3F5;background:#1F232C}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:5px 10px;border-radius:999px}
.pill.live{background:#3A1717;color:#FF9C9C}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.avatar{margin-left:auto;width:40px;height:40px;border-radius:50%;border:0;background:#262A33;color:#F2F3F5;font:700 16px 'Barlow',sans-serif}
.nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#12141A;border-top:1px solid #232733;height:64px;flex-shrink:0}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:#9AA1AD;text-decoration:none}
.nav a.on{color:#FF7A2F}
.nav svg{width:22px;height:22px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:#1F232C;border-radius:10px;padding:3px}
.seg a{display:flex;align-items:center;justify-content:center;height:38px;border-radius:8px;font:600 15px 'Barlow',sans-serif;color:#9AA1AD;text-decoration:none}
.seg a:hover{color:#F2F3F5}
.seg a.on{background:#353A46;color:#F2F3F5}
.li{display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 12px;border-bottom:1px solid #232733}
.sm{height:40px;padding:0 12px;border-radius:8px;border:1.5px solid #2F3440;background:#1F232C;font:600 14px 'Barlow',sans-serif;color:#F2F3F5;cursor:pointer}
.primary{height:48px;padding:0 16px;border-radius:10px;border:0;background:#FF7A2F;color:#1A0F06;font:700 16px 'Barlow',sans-serif;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 1140px; display: flex; flex-direction: column; background: #0E1014; font-family: 'Barlow', sans-serif; color: #F2F3F5">
<header class="top">
<a class="wkbtn" href="Weeks.dc.html" aria-label="Week 5, change week">Week 5<svg viewBox="0 0 24 24" width="20" height="20" class="ico" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></a>
<span class="pill live"><span class="dot"></span>Live</span>
<button class="avatar" aria-label="Account menu">D</button>
</header>
<main style="flex-grow: 1; overflow-y: auto; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 12px">
<nav class="seg" aria-label="Admin sections">
<a href="AdminPay.dc.html">Payments</a>
<a class="on" href="AdminGames.dc.html" aria-current="page">Games</a>
<a href="AdminPlayers.dc.html">Players</a>
</nav>
<section style="background: #171A21; border: 1px solid #232733; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 15px; line-height: 1.4"><strong>Scores from ESPN</strong><br><span style="color: #9AA1AD">Last synced 2:41 PM · nightly + when anyone opens the leaderboard</span></div>
<button class="primary">Sync from ESPN now</button>
</section>
<section style="background: #171A21; border: 1px solid #232733; border-radius: 14px; padding: 14px; display: flex; align-items: center; gap: 10px">
<div style="flex-grow: 1; font-size: 15px; line-height: 1.4"><strong>Picks lock</strong><br><span style="color: #9AA1AD">Thu, Oct 8 · 12:00 PM PT</span></div>
<button class="sm">Change</button>
</section>
<section style="background: #171A21; border: 1px solid #232733; border-radius: 14px; overflow: hidden">
<sc-for list="{{games}}" as="g" hint-placeholder-count="14">
<div class="li">
<span class="cond" style="flex-grow: 1; font-size: 19px; font-weight: 700">{{g.t}}</span>
<span style="font-size: 13px; color: #9AA1AD">{{g.s}}</span>
<button class="sm">Edit</button>
</div>
</sc-for>
</section>
</main>
<nav class="nav" aria-label="Main">
<a href="MyPicksLive.dc.html"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="M8 12l3 3 5-6"></path></svg>My Picks</a>
<a href="Live.dc.html"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M6 20V11M12 20V4M18 20v-6"></path></svg>Leaderboard</a>
<a href="Games.dc.html"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"></rect><path d="M4 12h16M12 5v14"></path></svg>Games</a>
<a class="on" href="AdminPay.dc.html" aria-current="page"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"></path></svg>Admin</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1140}}'>
const GAMES = [
  ['TB 20 @ ATL 27', 'Final'], ['MIN 24 @ CLE 17', 'Final'], ['NYG 23 @ NO 20', 'Final'], ['DAL 16 @ PIT 19', 'Final'],
  ['MIA 21 @ CAR 31', 'Final'], ['HOU 13 @ BAL 28', 'Final'], ['CIN 30 @ IND 27', 'Final'], ['LV 10 @ LAC 24', 'Final'],
  ['ARI 17 @ SF 34', 'Final'], ['GB @ LAR', 'In progress'], ['BUF @ JAX', 'In progress'], ['SEA @ WAS', 'In progress'],
  ['KC @ DET', 'Sun 5:20 PM'], ['NYJ @ NE', 'Mon 5:15 PM']
];
class Component extends DCLogic {
  renderVals() { return { games: GAMES.map(([t, s]) => ({ t, s })) }; }
}
</script>
</body>
</html>
